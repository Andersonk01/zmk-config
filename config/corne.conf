# Corne — split real (left = central BLE, right = periférico BLE)
CONFIG_ZMK_SPLIT=y

CONFIG_ZMK_KEYBOARD_NAME="Corne KB"

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Bateria do periférico visível no host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Mouse keys (Layer 5)
CONFIG_ZMK_MOUSE=y

# LED indicator (módulo zmk-poor-mans-led-indicator)
# Usa o LED onboard do nice!nano (P0.15) para indicar status
CONFIG_INDICATOR_LED_WIDGET=y
CONFIG_INDICATOR_LED_SHOW_BLE=y
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
